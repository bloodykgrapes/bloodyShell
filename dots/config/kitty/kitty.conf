confirm_os_window_close 0

window_margin_width 10

shell fish

font_family      JetBrains Mono Nerd Font
font_size 11.0

cursor_shape beam
cursor_trail 1

map ctrl+c copy_or_interrupt

map page_up   scroll_page_up
map page_down scroll_page_down

map ctrl+plus        change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+kp_subtract change_font_size all -1

map ctrl+0    change_font_size all 0
map ctrl+kp_0 change_font_size all 0

background            #1C1C1E
foreground            #FFFFFF
selection_background  #48484A
selection_foreground  #FFFFFF
cursor                #FFFFFF
cursor_text_color     #1C1C1E
url_color             #9A9A9A
active_border_color   #48484A
inactive_border_color #2C2C2E
active_tab_background #2C2C2E
active_tab_foreground #FFFFFF
inactive_tab_background #1C1C1E
inactive_tab_foreground #9A9A9A

color0  #1C1C1E
color1  #FF453A
color2  #30D158
color3  #FFD60A
color4  #0A84FF
color5  #BF5AF2
color6  #64D2FF
color7  #E5E5EA
color8  #636366
color9  #FF6961
color10 #5FE17A
color11 #FFE14D
color12 #409CFF
color13 #D783FF
color14 #7DDBFF
color15 #FFFFFF

globinclude bloodyShell-colors.conf
